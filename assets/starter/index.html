<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>starter</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// beautiful-motion starter: the render contract (window.TIMELINE, window.renderFrame(t, canvas), window.READY), a pure
// function of t. Two shots of one silhouette: chalk on a slate (it draws itself, then lives), then paper spreads from
// the centre and the ink soaks in. Seeded randomness keyed by what it draws, on 2s (a new drawing every 2 frames), a
// camera breath with overscan. Change W and H for another format (1080x1920 for 9:16): every size follows them.
// Open it in a browser to watch it loop; add ?t=2.5 to hold one time.
const W = 1080, H = 1080, FPS = 24, DURATION = 6.0, CUT = 3.0, SOAK = 0.5;
const S = Math.min(W, H) / 1080, CX = W / 2, CY = H / 2, R = 200 * S, RAYS = 12;
window.TIMELINE = { width: W, height: H, fps: FPS, duration: DURATION,
  shots: [{ id: 1, title: 'chalk', t0: 0, t1: CUT }, { id: 2, title: 'ink', t0: CUT, t1: DURATION }] };
// resolve once every image, plate and font the film needs is decoded; the renderer waits for it
window.READY = Promise.resolve();

// a small seeded generator, keyed by strings: rng('ray', 3) always gives the same sequence
function rng(...key) {
  let h = 2166136261;
  for (const ch of key.join('|')) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let x = h; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => x * x * (3 - 2 * x);

// the silhouette as a polyline: a disc and 12 tapered rays, turned by a, wobbled by the drawing's own hand
// (a few random values eased between, not a new one per point: a hand drifts, it does not jitter)
function sun(a, wob, key) {
  const r = rng(key), N = 36, nz = Array.from({ length: N }, () => r() - 0.5), pts = [];
  for (let i = 0; i <= 240; i++) {
    const th = i / 240 * Math.PI * 2, k = (th * RAYS / (Math.PI * 2)) % 1, spike = Math.max(0, 1 - Math.abs(k - 0.5) * 6);
    const u = i / 240 * N, j = Math.floor(u) % N, f = ease(u - Math.floor(u));
    const rad = R + 170 * S * spike + (nz[j] * (1 - f) + nz[(j + 1) % N] * f) * wob * S;
    pts.push([CX + rad * Math.cos(th + a), CY + rad * Math.sin(th + a)]);
  }
  return pts;
}
function stroke(g, pts, upto) {
  g.beginPath();
  const n = Math.max(2, Math.floor(pts.length * upto));
  pts.slice(0, n).forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  g.stroke();
}

function chalk(g, t, step) {
  // the slate: a dark field with a soft light from the upper left, its light drifting slowly (continuous in t)
  const lx = W * (0.28 + 0.055 * Math.sin(t * 0.4));
  const bg = g.createRadialGradient(lx, H * 0.24, 40 * S, CX, CY, 0.6 * Math.hypot(W, H));
  bg.addColorStop(0, '#465a60'); bg.addColorStop(1, '#22302f');
  g.fillStyle = bg; g.fillRect(-40, -40, W + 80, H + 80);
  // the chalk draws the outline over 1.6 s, three passes, each a new stroke on 2s, then the sun turns slowly
  const draw = ease(clamp(t / 1.6)), turn = 0.02 * t;
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let p = 0; p < 3; p++) {
    g.strokeStyle = `rgba(244,226,190,${0.55 - 0.12 * p})`; g.lineWidth = (7 - 2 * p) * S;
    stroke(g, sun(turn, 10, 'chalk' + p + '-' + step), clamp(draw * 1.15 - 0.07 * p));
  }
}

function ink(g, t, step) {
  g.fillStyle = '#efe5cf'; g.fillRect(-40, -40, W + 80, H + 80);
  const soak = ease(clamp((t - CUT) / 0.9)), turn = 0.02 * t;
  g.fillStyle = `rgba(214,92,52,${0.9 * soak})`;
  g.beginPath(); sun(turn, 3, 'ink-' + step).forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
  g.strokeStyle = `rgba(90,40,24,${0.8 * soak})`; g.lineWidth = 3 * S; stroke(g, sun(turn, 2, 'edge-' + step), 1);
}

window.renderFrame = (t, canvas) => {
  const g = canvas.getContext('2d');
  const step = Math.floor(Math.round(t * FPS) / 2);            // on 2s: the hand-drawn wobble changes every 2 frames
  // a camera breath of a few px, with an overscan that covers it (no bared edge)
  const bx = 3 * S * Math.sin(t * 0.7), by = 3 * S * Math.sin(t * 0.53 + 1), s = 1.012 + 0.004 * Math.sin(t * 0.31);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.save(); g.translate(CX + bx, CY + by); g.scale(s, s); g.translate(-CX, -CY);
  const spread = ease(clamp((t - CUT) / SOAK));
  if (spread < 1) chalk(g, t, step);
  if (t >= CUT) {
    // the paper spreads out from the sun's centre over the slate, its edge wobbling on 2s (no grey crossfade)
    if (spread < 1) {
      const r = rng('spread-' + step), rad = 0.55 * Math.hypot(W, H) * spread;
      g.save(); g.beginPath();
      for (let i = 0; i <= 64; i++) { const th = i / 64 * Math.PI * 2, d = rad * (1 + 0.06 * (r() - 0.5)); g.lineTo(CX + d * Math.cos(th), CY + d * Math.sin(th)); }
      g.clip(); ink(g, t, step); g.restore();
    } else ink(g, t, step);
  }
  g.restore();
};

// preview in a normal browser: loop the film, or hold ?t=. The renderer (an automated browser) skips this.
if (!navigator.webdriver) {
  const c = document.getElementById('c'); c.width = W; c.height = H;
  const hold = new URLSearchParams(location.search).get('t');
  window.READY.then(() => {
    if (hold !== null) return window.renderFrame(Number(hold), c);
    const start = performance.now();
    const tick = (now) => { window.renderFrame(Math.floor(((now - start) / 1000 % DURATION) * FPS) / FPS, c); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
</script>
</body>
</html>
